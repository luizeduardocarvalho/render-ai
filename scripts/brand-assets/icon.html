<!doctype html>
<!-- Source for the landing PNG icons (apple-touch-icon, manifest icons, favicon.ico).
     The symbol (landing/symbol.svg) centered on white at 512x512, full-bleed
     because iOS and Android apply their own corner mask. Rendered by render.sh. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; }
  html, body { width: 512px; height: 512px; overflow: hidden; background: #ffffff; }
  body { display: grid; place-items: center; }
  img { width: 340px; height: auto; display: block; }
</style>
</head>
<body>
  <img src="../../landing/symbol.svg" alt="" />
</body>
</html>
