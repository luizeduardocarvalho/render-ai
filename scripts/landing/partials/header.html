    <header class="site-header" id="top">
      <div class="wrap header-row">
        <a class="brand" href="{{home}}" aria-label="{{nav.home}}">
          <svg class="brand-mark" aria-hidden="true"><use href="#brand-symbol" /></svg>
          <span class="brand-name">Studio<b>IA</b></span>
        </a>
        <nav class="site-nav" aria-label="{{nav.primary}}">
          <a href="{{home}}#capabilities">{{nav.capabilities}}</a>
          <a href="{{home}}#method">{{nav.method}}</a>
          <a href="{{home}}#contact">{{nav.contact}}</a>
        </nav>
        <a class="lang-switch" href="{{switch.href}}" hreflang="{{switch.hreflang}}" lang="{{switch.hreflang}}" aria-label="{{switch.label}}">{{switch.text}}</a>
        <button class="theme-toggle" type="button" id="themeToggle" data-label-dark="{{theme.toDark}}" data-label-light="{{theme.toLight}}" hidden>
          <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" />
          </svg>
          <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4" />
          </svg>
        </button>
        <a class="btn btn-solid btn-small header-cta" href="{{home}}#contact">{{cta.requestAccess}}</a>
      </div>
    </header>
