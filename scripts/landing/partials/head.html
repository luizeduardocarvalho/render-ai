<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{page.title}}</title>
    <meta
      name="description"
      content="{{page.description}}"
    />
    <link rel="canonical" href="{{url}}" />
{{alternates}}

    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e1d1d" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Link previews (Open Graph + X/Twitter) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StudioIA" />
    <meta property="og:url" content="{{url}}" />
    <meta property="og:title" content="{{page.ogTitle}}" />
    <meta
      property="og:description"
      content="{{page.ogDescription}}"
    />
    <meta property="og:image" content="{{ogImage}}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="{{og.imageAlt}}"
    />
    <meta property="og:locale" content="{{ogLocale}}" />
    <meta property="og:locale:alternate" content="{{ogLocaleAlt}}" />
    <meta name="twitter:card" content="summary_large_image" />

{{page.headExtra}}

    <link rel="preload" href="/fonts/d-din-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/d-din-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/styles.css" />
    <!-- Apply a saved theme choice before first paint (no flash). -->
    <script>
      try {
        var theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
