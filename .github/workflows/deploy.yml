name: Deploy

# Manual deploy to production: Actions -> Deploy -> Run workflow.
#
# Backend: builds backend/Dockerfile, pushes it to Artifact Registry and rolls
# it out to the render-ai-worker and render-ai-api Cloud Run services (same
# image; the worker only runs render tasks). Only the image changes - env
# vars, secret, service account and scaling stay as Terraform set them.
# Frontend: builds frontend/ and runs `firebase deploy --only hosting,firestore`
# (both Hosting sites plus firestore.rules).
# Landing: deploys only the landing Hosting site (`hosting:landing`), straight
# from landing/ - no build, and the app, backend and rules are left alone.
#
# Runs in the GitHub `production` environment, so its protection rules (e.g.
# required reviewers) apply, and signs in to Google Cloud through Workload
# Identity Federation as the deployer service account (infra/terraform/
# deploy.tf) - no keys are stored in GitHub.
#
# Variables of the `production` environment, all set by Terraform
# (infra/terraform/github_actions.tf): GCP_WIF_PROVIDER, GCP_DEPLOYER_SA,
# GCP_ARTIFACT_REPO, GCP_PROJECT, GCP_REGION, VITE_CLERK_PUBLISHABLE_KEY.

on:
  workflow_dispatch:
    inputs:
      component:
        description: "What to deploy: both = backend + frontend; frontend = app + landing + Firestore rules; landing = landing page only"
        type: choice
        options: [both, backend, frontend, landing]
        default: both

permissions:
  contents: read
  id-token: write

# One deploy at a time; never cancel one halfway through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  backend:
    if: inputs.component == 'both' || inputs.component == 'backend'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        id: image
        env:
          REPO: ${{ vars.GCP_ARTIFACT_REPO }}
        run: |
          set -euo pipefail
          image="${REPO}/render-ai-api:${GITHUB_SHA}"
          gcloud auth configure-docker "${REPO%%/*}" --quiet
          docker build -t "$image" backend
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          PROJECT: ${{ vars.GCP_PROJECT }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          set -euo pipefail
          for service in render-ai-worker render-ai-api; do
            gcloud run deploy "$service" \
              --image "$IMAGE" \
              --project "$PROJECT" \
              --region "$REGION" \
              --quiet
            gcloud run services describe "$service" \
              --project "$PROJECT" --region "$REGION" \
              --format='value(status.url,status.latestReadyRevisionName)'
          done

  frontend:
    # Runs after the backend when both are deployed (the new frontend calls
    # new API routes), and on its own when only the frontend is chosen.
    needs: backend
    if: >-
      always() && (inputs.component == 'both' || inputs.component == 'frontend') &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build
        working-directory: frontend
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          # A real key is pk_live_/pk_test_ followed by base64. Refuse
          # placeholders like "pk_live_...", which build fine but break
          # sign-in for everyone.
          if ! [[ "$VITE_CLERK_PUBLISHABLE_KEY" =~ ^pk_(live|test)_[A-Za-z0-9+/=_-]{16,}$ ]]; then
            echo "::error::VITE_CLERK_PUBLISHABLE_KEY in the production environment is missing or not a real Clerk publishable key. Set clerk_publishable_key in infra/terraform/terraform.tfvars and run terraform apply."
            exit 1
          fi
          pnpm install --frozen-lockfile
          pnpm run check:i18n
          pnpm run build

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Deploy Hosting and Firestore rules
        env:
          PROJECT: ${{ vars.GCP_PROJECT }}
        run: npx --yes firebase-tools@15 deploy --only hosting,firestore --project "$PROJECT" --non-interactive

  landing:
    # The landing page is static files served as-is from landing/, so a copy
    # or asset change ships without rebuilding the app or touching the rest.
    if: inputs.component == 'landing'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Deploy the landing Hosting site
        env:
          PROJECT: ${{ vars.GCP_PROJECT }}
        run: npx --yes firebase-tools@15 deploy --only hosting:landing --project "$PROJECT" --non-interactive
