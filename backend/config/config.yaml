# Local PoC configuration. Edit freely; loaded at startup.

server:
  port: 8080
  # Generous timeout for synchronous renders (seconds).
  renderTimeoutSec: 180

vertex:
  # Set via env instead if you prefer: GOOGLE_CLOUD_PROJECT / GOOGLE_CLOUD_LOCATION.
  # Image models run ONLY on the global endpoint.
  project: "labflux-project" # GCP project with Vertex AI enabled (env GOOGLE_CLOUD_PROJECT overrides)
  location: "global"          # required for the Gemini 3 image models (do NOT use us-central1 here)
  textLocation: "us-central1" # text model endpoint; text models are NOT served from "global"

models:
  # Resolved model ids sent to Vertex AI.
  proImage: "gemini-3-pro-image"       # Nano Banana Pro (1K/2K/4K) - global endpoint
  flashImage: "gemini-3.1-flash-image" # Nano Banana 2   (1K only)  - global endpoint
  text: "gemini-2.5-flash"             # inventory + preservation inventory check (runs on textLocation)

# Fill in current prices. Used to estimate cost for the metrics panel and for
# GET /api/pricing. perImage is per generated image at the given resolution
# (this already covers the output image's own tokens - see EstimateCost).
# inputPerMTok/outputPerMTok are USD per 1M tokens for that model's own
# prompt/thinking/text-output tokens.
pricing:
  proImage: # gemini-3-pro-image (Nano Banana Pro), Vertex AI pricing page
    perImage:
      "1K": 0.134
      "2K": 0.134
      "4K": 0.24
    inputPerMTok: 2.00
    outputPerMTok: 12.00 # text and thinking output
  flashImage: # gemini-3.1-flash-image (Nano Banana 2)
    perImage:
      "1K": 0.039
    inputPerMTok: 0.50  # TODO verify on the Vertex AI pricing page
    outputPerMTok: 3.00 # TODO verify on the Vertex AI pricing page
  # Text model token pricing, USD per 1M tokens (inventory + preservation check).
  text:
    inputPerMTok: 0.30
    outputPerMTok: 2.50
  # USD -> BRL rate used only to show a BRL estimate alongside the USD one.
  usdToBrl: 5.16

preservation:
  # Edge IoU below this is flagged in the UI.
  edgeScoreFlagThreshold: 0.55
  # Dilation (px) applied before computing edge overlap, to tolerate sub-pixel drift.
  edgeDilationPx: 2
